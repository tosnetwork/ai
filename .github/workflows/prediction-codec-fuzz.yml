name: Prediction codec fuzz

# Runs on every pull request. A paths filter is evaluated against only the
# first 300 changed files of a pull request, so on a large change it can skip
# this workflow even when the decoders changed; the run is bounded and cheap.
on:
  pull_request:

permissions:
  contents: read

jobs:
  malformed-cell-decoders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Do not inherit a parent checkout's unrelated Go workspace.
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      # The regular suite runs the fixed seeds. This bounded native fuzz run
      # additionally mutates untrusted BOCs and must find neither a panic nor
      # an invariant violation in the strict PredictionMarket decoders. The
      # Makefile bounds the run by an execution count; this step's timeout
      # bounds its wall time.
      - name: Fuzz strict PredictionMarket decoders
        timeout-minutes: 5
        run: make fuzz
