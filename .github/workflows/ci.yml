name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The tosctl build that signs and verifies ML-DSA-44 for the Native
  # Registry and the Action Authority and, for the context-separation tests,
  # custody authorizations. Tests that check real ML-DSA-44 bytes fail,
  # rather than skip, without it. Repin when the helper lands on the tos main
  # branch.
  TOS_HELPER_REPOSITORY: tosnetwork/tos
  TOS_HELPER_COMMIT: c41331dd3103c0eac719d7e5f368079f0a40e64f

jobs:
  test:
    # Pinned to the image messenger's attachment sandbox tests were verified
    # on: it provides bubblewrap and a user systemd manager. An unannounced
    # image change must not silently change what those tests cover.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # The two checkouts are siblings so the repository's own format and
      # vet checks never walk the helper's source tree.
      - uses: actions/checkout@v4
        with:
          path: ai
          # pull_request events normally check out GitHub's synthetic merge
          # ref. Validate the exact proposed revision here; PR mergeability
          # is checked independently by GitHub.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the pinned tosctl helper source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOS_HELPER_REPOSITORY }}
          ref: ${{ env.TOS_HELPER_COMMIT }}
          path: tos
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          # make verify checks the format of messenger's OpenMLS driver.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tos/tosctl/src -> target
          key: tosctl-${{ env.TOS_HELPER_COMMIT }}
      - name: Build the tosctl helper
        working-directory: tos/tosctl/src
        run: cargo build -p tosctl --bin tosctl --locked
      - name: Pin the tosctl helper for the tests
        run: |
          helper="$GITHUB_WORKSPACE/tos/tosctl/src/target/debug/tosctl"
          chmod 0755 "$helper"
          echo "TOS_SERVICE_TOSCTL=$helper" >> "$GITHUB_ENV"
          echo "TOS_SERVICE_TOSCTL_SHA256=$(sha256sum "$helper" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: ai/go.sum
      - name: Verify checked-out revision
        working-directory: ai
        run: |
          echo "event=${{ github.event_name }}"
          echo "expected=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      # Messenger's attachment scanner runs a pinned, staged copy of
      # bubblewrap in an unprivileged user namespace. The runner restricts
      # such namespaces through AppArmor and no profile covers the staged
      # copy, so bwrap cannot configure the sandbox ("loopback: Failed
      # RTM_NEWADDR: Operation not permitted"). Lift the restriction for this
      # job, and install bubblewrap where an image lacks it; make verify then
      # fails if any sandbox test skips (make messenger-sandbox).
      - name: Provide the attachment scanner sandbox
        run: |
          command -v bwrap >/dev/null || { sudo apt-get update && sudo apt-get install -y bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify the repository
        working-directory: ai
        run: make verify
