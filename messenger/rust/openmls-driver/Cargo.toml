[package]
name = "tos-openmls-driver"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22.1"
openmls = "=0.8.1"
openmls_basic_credential = "=0.5.0"
openmls_memory_storage = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tls_codec = "0.4"


# The 64-leaf state-bound tests run thousands of MLS operations; optimizing
# the dependencies keeps them to seconds in the debug profile without changing
# what the driver crate itself is compiled as.
[profile.dev.package."*"]
opt-level = 2

# The library asserts in debug builds where a message fails to decrypt
# (framing/private_message_in.rs), and so aborts the driver where a release
# build returns the error. A message that does not open is input, never a
# driver fault: the debug profile reports it as a release build does.
[profile.dev.package.openmls]
debug-assertions = false
